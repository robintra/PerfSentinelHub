{{- $ids := dict }}
{{- range .Values.sources }}
{{- if hasKey $ids .id }}{{ fail (printf "duplicate source id: %s" .id) }}{{ end }}
{{- $_ := set $ids .id true }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perf-sentinel-hub.name" . }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "perf-sentinel-hub.labels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The config is mounted with subPath, which Kubernetes never refreshes in place:
        # this checksum rolls the pod whenever the ConfigMap content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "perf-sentinel-hub.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            {{- range $index, $source := .Values.sources }}
            {{- if $source.authSecretName }}
            - name: Hub__Sources__{{ $index }}__AuthHeaderValue
              valueFrom:
                secretKeyRef:
                  name: {{ $source.authSecretName }}
                  key: {{ $source.authSecretKey }}
            {{- end }}
            {{- if $source.importSecretName }}
            - name: Hub__Sources__{{ $index }}__ImportApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ $source.importSecretName }}
                  key: {{ $source.importSecretKey }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /app/appsettings.Production.json, subPath: appsettings.Production.json }
          startupProbe: { httpGet: { path: /health/ready, port: http }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ include "perf-sentinel-hub.name" . }} }
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
        - name: config
          configMap: { name: {{ include "perf-sentinel-hub.name" . }} }
