name: Release Verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: Stable tag or exact GitHub Release URL; empty selects latest stable
        required: false
        type: string
  schedule:
    - cron: '17 5 * * *'

permissions: {}

concurrency:
  group: release-verification-${{ inputs.release || github.event.release.tag_name || 'latest-stable' }}
  cancel-in-progress: false

jobs:
  public-release:
    name: Download latest-stable public assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.selection.outputs.tag }}
      version: ${{ steps.authentication.outputs.version }}
      source_commit: ${{ steps.authentication.outputs.source_commit }}
      image_digest: ${{ steps.authentication.outputs.image_digest }}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/verify-release.py
            scripts/check-image-manifest.py
          sparse-checkout-cone-mode: false
      - name: Download every page of public release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.release || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$REQUESTED_RELEASE" ]; then
            gh api --paginate --slurp 'repos/robintra/PerfSentinelHub/releases?per_page=100' > "$RUNNER_TEMP/releases.json"
          else
            printf '[]' > "$RUNNER_TEMP/releases.json"
          fi
      - id: selection
        name: Select one canonical stable release without a token
        env:
          REQUESTED_RELEASE: ${{ inputs.release || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_RELEASE" ]; then
            tag="$(python3 scripts/verify-release.py public-input "$REQUESTED_RELEASE" | jq -r .tag)"
          else
            tag="$(python3 scripts/verify-release.py latest-stable < "$RUNNER_TEMP/releases.json")"
          fi
          printf '%s' "$tag" | grep -Eq '^v0[.][0-9]+[.][0-9]+$'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download the closed public release without executing its contents
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.selection.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          state="$(gh release view "$tag" --repo robintra/PerfSentinelHub --json isDraft,isPrerelease,tagName --jq '[.isDraft,.isPrerelease,.tagName] | @tsv')"
          test "$state" = "false	false	$tag"
          mkdir public-release
          gh release download "$tag" --repo robintra/PerfSentinelHub --dir public-release
      - id: authentication
        name: Authenticate downloaded public assets and SHA256SUMS
        env:
          TAG: ${{ steps.selection.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          python3 scripts/verify-release.py verify-published --root public-release
          source_commit="$(jq -r .source.commit public-release/release-manifest.json)"
          version="$(jq -r .version public-release/release-manifest.json)"
          image_digest="$(jq -r .image.digest public-release/release-manifest.json)"
          printf '%s' "$source_commit" | grep -Eq '^[0-9a-f]{40}$'
          test "$version" = "${tag#v}"
          {
            echo "source_commit=$source_commit"
            echo "image_digest=$image_digest"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release
          path: public-release
          if-no-files-found: error
          retention-days: 1

  cryptography:
    name: Verify public attestations and Cosign bundles
    needs: public-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-release
          path: public-release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify every exact subject with strict public identities
        env:
          TAG: ${{ needs.public-release.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.public-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          identity="https://github.com/robintra/PerfSentinelHub/.github/workflows/release.yml@refs/tags/$TAG"
          issuer=https://token.actions.githubusercontent.com
          python3 - <<'PY' > subjects
          import json
          for subject in json.load(open('public-release/release-manifest.json', encoding='utf-8'))['subjects']:
              print(subject['name'])
          PY
          while read -r subject; do
            cosign verify-blob --bundle "public-release/$subject.sigstore.json" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "public-release/$subject"
            gh attestation verify "public-release/$subject" --bundle public-release/release.provenance.sigstore.json --repo robintra/PerfSentinelHub --cert-identity "$identity" --cert-oidc-issuer "$issuer" --source-ref "refs/tags/$TAG" --source-digest "$SOURCE_COMMIT" --deny-self-hosted-runners >/dev/null
            gh attestation verify "public-release/$subject" --bundle "public-release/$subject.sbom.sigstore.json" --repo robintra/PerfSentinelHub --predicate-type https://spdx.dev/Document/v2.3 --cert-identity "$identity" --cert-oidc-issuer "$issuer" --source-ref "refs/tags/$TAG" --source-digest "$SOURCE_COMMIT" --deny-self-hosted-runners >/dev/null
          done < subjects

  native:
    name: Start public native binary (${{ matrix.rid }})
    needs: [public-release, cryptography]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            extension: tar.gz
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            extension: tar.gz
          - rid: osx-arm64
            runner: macos-15
            extension: tar.gz
          - rid: win-x64
            runner: windows-2025
            extension: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-release
          path: public-release
      - name: Extract the exact public runtime
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.public-release.outputs.version }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, tarfile, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path('public-release') / f"perf-sentinel-hub-{os.environ['VERSION']}-{os.environ['RID']}.{os.environ['EXTENSION']}"
          Path('smoke').mkdir()
          if archive.suffix == '.zip':
              with zipfile.ZipFile(archive) as package:
                  for item in package.infolist():
                      path = PurePosixPath(item.filename)
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit('unsafe ZIP path')
                  package.extractall('smoke')
          else:
              with tarfile.open(archive, 'r:gz') as package:
                  package.extractall('smoke', filter='data')
          PY
      - name: Start Unix binary and check readiness
        if: runner.os != 'Windows'
        shell: bash
        env:
          Hub__DatabasePath: ${{ runner.temp }}/hub.db
          Hub__Sources__0__Id: verify
          Hub__Sources__0__Name: Verify
          Hub__Sources__0__Environment: release
          Hub__Sources__0__BaseUrl: http://127.0.0.1:9
        run: |
          set -euo pipefail
          smoke/PerfSentinelHub --urls http://127.0.0.1:5082 > "$RUNNER_TEMP/native.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5082/health/ready', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except OSError:
                  time.sleep(.5)
          raise SystemExit('native health smoke timed out')
          PY
      - name: Start Windows binary and check readiness
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          Hub__DatabasePath: ${{ runner.temp }}/hub.db
          Hub__Sources__0__Id: verify
          Hub__Sources__0__Name: Verify
          Hub__Sources__0__Environment: release
          Hub__Sources__0__BaseUrl: http://127.0.0.1:9
        run: |
          $process = Start-Process (Resolve-Path smoke/PerfSentinelHub.exe) -ArgumentList '--urls','http://127.0.0.1:5082' -PassThru
          try {
            foreach ($attempt in 1..40) {
              try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 1 http://127.0.0.1:5082/health/ready).StatusCode -eq 200) { exit 0 } } catch { Start-Sleep -Milliseconds 500 }
            }
            throw 'native health smoke timed out'
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }

  image:
    name: Start public image by digest
    needs: [public-release, cryptography]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Pull and start only the immutable public digest
        env:
          IMAGE_DIGEST: ${{ needs.public-release.outputs.image_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/robintra/perf-sentinel-hub@$IMAGE_DIGEST"
          docker pull "$image"
          id="$(docker run -d --rm -p 127.0.0.1:5082:8080 -e Hub__DatabasePath=/tmp/hub.db -e Hub__Sources__0__Id=verify -e Hub__Sources__0__Name=Verify -e Hub__Sources__0__Environment=release -e Hub__Sources__0__BaseUrl=http://127.0.0.1:9 "$image")"
          trap 'docker stop "$id" >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5082/health/ready', timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except OSError:
                  time.sleep(.5)
          raise SystemExit('image health smoke timed out')
          PY

  chart:
    name: Verify public chart digest and bound image digest
    needs: [public-release, cryptography]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-release
          path: public-release
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Pull chart by digest, compare bytes, and render the same image digest
        env:
          VERSION: ${{ needs.public-release.outputs.version }}
          IMAGE_DIGEST: ${{ needs.public-release.outputs.image_digest }}
        run: |
          set -euo pipefail
          chart=ghcr.io/robintra/charts/perf-sentinel-hub
          chart_digest="$(oras resolve "$chart:$VERSION")"
          printf '%s' "$chart_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          helm pull "oci://$chart@$chart_digest" --destination chart
          cmp "public-release/perf-sentinel-hub-$VERSION.tgz" "chart/perf-sentinel-hub-$VERSION.tgz"
          helm template verify "chart/perf-sentinel-hub-$VERSION.tgz" --set 'sources[0].id=verify' --set 'sources[0].name=Verify' --set 'sources[0].environment=release' --set 'sources[0].baseUrl=http://127.0.0.1:9' > rendered.yaml
          test "$(grep -Fc "ghcr.io/robintra/perf-sentinel-hub@$IMAGE_DIGEST" rendered.yaml)" -eq 1

  report:
    name: Maintain one sanitized scheduled alert
    if: always() && github.event_name == 'schedule'
    needs: [public-release, cryptography, native, image, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILED: ${{ needs.public-release.result != 'success' || needs.cryptography.result != 'success' || needs.native.result != 'success' || needs.image.result != 'success' || needs.chart.result != 'success' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'release-verification-alert';
            const title = 'Daily public release verification failed';
            const body = `Verification failed. Inspect the workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            try {
              await github.rest.issues.getLabel({owner, repo, name: label});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({owner, repo, name: label, color: 'b60205', description: 'Public release verification needs attention'});
            }
            const candidates = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'all', labels: label, per_page: 100});
            const issues = candidates
              .filter(issue => !issue.pull_request && issue.title === title && issue.labels.some(item => item.name === label))
              .sort((left, right) => left.number - right.number);
            if (process.env.FAILED === 'true') {
              if (issues.length) {
                await github.rest.issues.update({owner, repo, issue_number: issues[0].number, title, body, labels: [label], state: 'open'});
                for (const duplicate of issues.slice(1)) {
                  if (duplicate.state !== 'closed') await github.rest.issues.update({owner, repo, issue_number: duplicate.number, state: 'closed'});
                }
              } else {
                await github.rest.issues.create({owner, repo, title, body, labels: [label]});
              }
            } else {
              if (issues.length && issues[0].state !== 'closed') {
                await github.rest.issues.createComment({owner, repo, issue_number: issues[0].number, body: 'Verification succeeded; closing the alert.'});
                await github.rest.issues.update({owner, repo, issue_number: issues[0].number, state: 'closed'});
              }
              for (const duplicate of issues.slice(1)) {
                if (duplicate.state !== 'closed') await github.rest.issues.update({owner, repo, issue_number: duplicate.number, state: 'closed'});
              }
            }
