apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "perf-sentinel-hub.name" . }}
data:
  appsettings.Production.json: |-
    {{- $sources := list }}
    {{- range .Values.sources }}
    {{- $sources = append $sources (dict "Id" .id "Name" .name "Environment" .environment "Kind" (default "daemon" .kind) "RetentionHours" .retentionHours "BaseUrl" .baseUrl "PublicUrl" .publicUrl "AuthHeaderName" .authHeaderName "PublicAuthHeaderName" .publicAuthHeaderName) }}
    {{- end }}
    {{- $analysis := dict "EngineBinaryPath" .Values.hub.analysis.engineBinaryPath "ReportDirectory" "/data/reports" "IdentityHeader" .Values.hub.analysis.identityHeader "Workers" .Values.hub.analysis.workers "MaxTracesCap" .Values.hub.analysis.maxTracesCap "Timeout" .Values.hub.analysis.timeout "ReportRetention" .Values.hub.analysis.reportRetention "RunRetention" .Values.hub.analysis.runRetention }}
    {{- /* Nil-safe and false-safe. An upgrade with --reuse-values carries values
           that predate this key, so a bare lookup is a nil pointer; and `default
           true` would read an explicit false as absent and turn the check back
           on. hasKey is the only form that tells the two apart. */}}
    {{- $update := .Values.hub.updateCheck | default dict }}
    {{- $enabled := true }}
    {{- if hasKey $update "enabled" }}{{- $enabled = $update.enabled }}{{- end }}
    {{- $updateCheck := dict "Enabled" $enabled }}
    {{- /* Nil-safe for --reuse-values, like updateCheck above. The secret is
           not here: it reaches the pod as an environment variable. */}}
    {{- $authValues := .Values.hub.auth | default dict }}
    {{- $auth := dict "Enabled" false }}
    {{- if $authValues.enabled }}
    {{- $auth = dict "Enabled" true "AuthorizationEndpoint" $authValues.authorizationEndpoint "TokenEndpoint" $authValues.tokenEndpoint "UserInformationEndpoint" $authValues.userInformationEndpoint "ClientId" $authValues.clientId "Scopes" (default "openid profile email" $authValues.scopes) "IdentityClaim" (default "email" $authValues.identityClaim) }}
    {{- end }}
    {{ dict "Hub" (dict "DatabasePath" "/data/hub.db" "Analysis" $analysis "UpdateCheck" $updateCheck "Auth" $auth "PollInterval" .Values.hub.pollInterval "HttpTimeout" .Values.hub.httpTimeout "MaxConcurrentPolls" .Values.hub.maxConcurrentPolls "Retention" .Values.hub.retention "ResolutionGrace" .Values.hub.resolutionGrace "DefaultReadLimit" .Values.hub.defaultReadLimit "MaxReadLimit" .Values.hub.maxReadLimit "Sources" $sources) | toJson }}
