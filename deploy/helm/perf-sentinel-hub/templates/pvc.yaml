apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "perf-sentinel-hub.name" . }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
