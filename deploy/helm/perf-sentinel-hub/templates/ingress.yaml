{{- /* Nil-safe for --reuse-values, like hub.updateCheck in the ConfigMap. */ -}}
{{- $ingress := .Values.ingress | default dict -}}
{{- if $ingress.enabled -}}
{{- if not $ingress.host -}}
{{- fail "ingress.host is required: the Hub is served at the root of its own host, which the OAuth redirect URI also names" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "perf-sentinel-hub.name" . }}
  labels:
    {{- include "perf-sentinel-hub.labels" . | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $ingress.host | quote }}
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ $ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "perf-sentinel-hub.name" . }}
                port:
                  number: 8080
{{- end }}
