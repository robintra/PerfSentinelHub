apiVersion: v1
kind: Service
metadata:
  name: {{ include "perf-sentinel-hub.name" . }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    {{- include "perf-sentinel-hub.labels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: http
